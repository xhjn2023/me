name: Deploy to Cloudflare Pages

# main 分支 → production 部署；其他分支 → preview 预览部署
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'

      - name: Verify build output
        run: ls -la dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          BRANCH_NAME="${{ github.ref_name }}"

          # 1. 认证检查
          echo "=== 1. Auth check ==="
          npx wrangler@latest whoami 2>&1

          # 2. 确保 Pages 项目存在（不存在则创建，存在则忽略错误）
          echo ""
          echo "=== 2. Ensure Pages project exists ==="
          npx wrangler@latest pages project create me-workbench \
            --production-branch=main \
            --yes 2>&1 || true

          # 3. 部署（main → production，其他分支 → preview）
          echo ""
          echo "=== 3. Deploy (branch: $BRANCH_NAME) ==="
          DEPLOY_OUT=$(npx wrangler@latest pages deploy dist \
            --project-name=me-workbench \
            --branch="$BRANCH_NAME" 2>&1)
          DEPLOY_CODE=$?
          echo "$DEPLOY_OUT"
          echo "Exit code: $DEPLOY_CODE"
          set -e
          if [ "$DEPLOY_CODE" -ne 0 ]; then
            echo ""
            echo "=== DEPLOY FAILED ==="
            echo "$DEPLOY_OUT"
            exit 1
          fi

          # 4. 提取预览 URL 并写入 GitHub Actions Summary
          echo ""
          echo "=== 4. Extract preview URL ==="
          PREVIEW_URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.me-workbench\.pages\.dev' | head -n 1)
          echo "Preview URL: $PREVIEW_URL"
          if [ -n "$PREVIEW_URL" ]; then
            echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo "## 🚀 预览地址" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY
          fi
