name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'

      - name: Verify build output
        run: ls -la dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # 1. 认证检查
          echo "=== 1. Auth check ==="
          npx wrangler@latest whoami 2>&1

          # 2. 确保 Pages 项目存在（不存在则创建，存在则忽略错误）
          echo ""
          echo "=== 2. Ensure Pages project exists ==="
          npx wrangler@latest pages project create me-workbench \
            --production-branch=main \
            --yes 2>&1 || true

          # 3. 部署
          echo ""
          echo "=== 3. Deploy ==="
          DEPLOY_OUT=$(npx wrangler@latest pages deploy dist \
            --project-name=me-workbench \
            --branch=main 2>&1)
          DEPLOY_CODE=$?
          echo "$DEPLOY_OUT"
          echo "Exit code: $DEPLOY_CODE"
          set -e
          if [ "$DEPLOY_CODE" -ne 0 ]; then
            echo ""
            echo "=== DEPLOY FAILED ==="
            echo "$DEPLOY_OUT"
            exit 1
          fi
