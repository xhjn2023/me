name: Deploy to Cloudflare Pages

# main 分支 → production 部署；其他分支 → preview 预览部署
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'

      - name: Verify build output
        run: ls -la dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's|/|-|g')

          # 1. 认证检查
          echo "=== 1. Auth check ==="
          npx wrangler@latest whoami 2>&1

          # 2. 确保 Pages 项目存在（不存在则创建，存在则忽略错误）
          echo ""
          echo "=== 2. Ensure Pages project exists ==="
          npx wrangler@latest pages project create me-workbench \
            --production-branch=main \
            --yes 2>&1 || true

          # 3. 部署（main → production，其他分支 → preview）
          echo ""
          echo "=== 3. Deploy (branch: $BRANCH_NAME, slug: $BRANCH_SLUG) ==="
          DEPLOY_OUT=$(npx wrangler@latest pages deploy dist \
            --project-name=me-workbench \
            --branch="$BRANCH_SLUG" 2>&1)
          DEPLOY_CODE=$?
          echo "--- wrangler output ---"
          echo "$DEPLOY_OUT"
          echo "--- end wrangler output (exit code: $DEPLOY_CODE) ---"
          set -e
          if [ "$DEPLOY_CODE" -ne 0 ]; then
            echo ""
            echo "=== DEPLOY FAILED ==="
            echo "$DEPLOY_OUT"
            exit 1
          fi

          # 4. 列出所有部署，获取最新的预览 URL
          echo ""
          echo "=== 4. List deployments ==="
          npx wrangler@latest pages deployment list \
            --project-name=me-workbench 2>&1 | tee /tmp/deploy-list.txt

          # 5. 构造预览 URL（Cloudflare Pages 惯例：<branch-slug>.<project>.pages.dev）
          PREVIEW_URL="https://${BRANCH_SLUG}.me-workbench.pages.dev"
          echo "Constructed preview URL: $PREVIEW_URL"

          # 6. 尝试从 wrangler 输出中提取 URL
          EXTRACTED_URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev' | head -n 1)
          if [ -n "$EXTRACTED_URL" ]; then
            echo "Extracted URL from wrangler output: $EXTRACTED_URL"
            PREVIEW_URL="$EXTRACTED_URL"
          fi

          # 7. 验证部署是否可访问
          echo ""
          echo "=== 7. Verify deployment ==="
          sleep 5
          if curl -sI "$PREVIEW_URL" | grep -q "200\|301\|302"; then
            echo "✅ Deployment verified at $PREVIEW_URL"
          else
            echo "⚠️ Deployment not yet accessible at $PREVIEW_URL, but continuing"
          fi

          # 8. 写入 GitHub Actions Summary
          echo ""
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "## 🚀 预览地址" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY
