name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'

      - name: Verify build output
        run: ls -la dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            wrangler --version
            wrangler whoami 2>&1 || true
            echo "--- Build artifacts exist ---"
            test -f dist/index.html && echo "OK: dist/index.html"
            test -d dist/assets && echo "OK: dist/assets/"
          command: pages deploy dist --project-name=me-workbench --branch=main --verbose 2>&1
          quiet: false
