name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'

      - name: Verify build output
        run: ls -la dist/

      - name: Deploy to Cloudflare Pages
        env:
          # 两套环境变量同时设置，兼容不同 wrangler 版本
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 1. Wrangler version ==="
          npx wrangler@latest --version
          echo ""
          echo "=== 2. Wrangler whoami (auth check) ==="
          set +e
          AUTH_LOG=$(npx wrangler@latest whoami 2>&1)
          AUTH_CODE=$?
          echo "$AUTH_LOG"
          echo "Exit code: $AUTH_CODE"
          set -e
          echo ""
          echo "=== 3. Pages deploy ==="
          set +e
          DEPLOY_LOG=$(npx wrangler@latest pages deploy dist \
            --project-name=me-workbench \
            --branch=main 2>&1)
          DEPLOY_CODE=$?
          echo "$DEPLOY_LOG"
          echo "Exit code: $DEPLOY_CODE"
          set -e
          echo ""
          if [ "$DEPLOY_CODE" -ne 0 ]; then
            echo "DEPLOY FAILED. Dumping captured output again to ensure visible:"
            echo "--- START AUTH LOG ---"
            echo "$AUTH_LOG"
            echo "--- END AUTH LOG ---"
            echo "--- START DEPLOY LOG ---"
            echo "$DEPLOY_LOG"
            echo "--- END DEPLOY LOG ---"
            exit 1
          fi
